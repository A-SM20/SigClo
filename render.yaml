services:
  # 1. FastAPI Backend
  - type: web
    name: signal-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in the Render dashboard to your Neon URL
      - key: SECRET_KEY
        generateValue: true

  # 2. Next.js Frontend
  - type: web
    name: signal-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: signal-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_WS_URL
        sync: false # Set this manually in Render to wss://signal-backend-.../ws
